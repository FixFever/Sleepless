# docker compose -f docker-compose-dev.yaml up --build

name: sleepless-dev

services:
  frontend:
    image: node:24
    container_name: frontend
    volumes:
      - ./frontend:/home/mediacms.io/mediacms/frontend/
      - frontend_node_modules:/home/mediacms.io/mediacms/frontend/node_modules
      - frontend_npm_cache:/home/node/.npm
    working_dir: /home/mediacms.io/mediacms/frontend/
    command: bash -c "npm install --cache /home/node/.npm && npm run start"
    env_file:
      - ./frontend/.env
    environment:
      WATCHPACK_POLLING: '1000'
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: base
      args:
        - DEVELOPMENT_MODE=True
    image: mediacms/mediacms-dev:latest
    container_name: web
    command: "python manage.py runserver 0.0.0.0:80"
    environment:
      DEVELOPMENT_MODE: 'True'
      ENABLE_MIGRATIONS: 'no'
      POSTGRES_HOST: '${POSTGRES_HOST:-postgres}'
      POSTGRES_DB: '${POSTGRES_DB:-mediacms}'
      POSTGRES_USER: '${POSTGRES_USER:?Set POSTGRES_USER in the env file}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}'
      SECRET_KEY: '${SLEEPLESS_SECRET_KEY:?Set SLEEPLESS_SECRET_KEY in the env file}'
      REDIS_LOCATION: '${DEV_REDIS_LOCATION:-redis://redis:6379/2}'
      EMAIL: '${EMAIL:-}'
      EMAIL_PASSWORD: '${EMAIL_PASSWORD:-}'
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/home/mediacms.io/mediacms/
      - M:\\mediacms:/home/mediacms.io/mediacms/media_files
    networks:
      - default
      - server_default

volumes:
  frontend_node_modules:
    external: true
  frontend_npm_cache:
    external: true

networks:
  server_default:
    external: true
