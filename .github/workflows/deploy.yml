name: Sleepless CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sleepless-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fixfever/sleepless:${{ github.sha }}
            ghcr.io/fixfever/sleepless:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy image to Windows host
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - name: Pull image and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\apps\sleepless'

            git pull --ff-only origin main
            if ($LASTEXITCODE -ne 0) { throw 'git pull failed' }

            $env:SLEEPLESS_IMAGE_TAG = '${{ github.sha }}'
            docker compose pull
            if ($LASTEXITCODE -ne 0) { throw 'docker compose pull failed' }

            docker compose up -d --no-build --remove-orphans
            if ($LASTEXITCODE -ne 0) { throw 'docker compose up failed' }

  cleanup:
    name: Remove old image versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    steps:
      - name: Keep the 10 most recent images
        uses: actions/delete-package-versions@v5
        with:
          package-name: sleepless
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
